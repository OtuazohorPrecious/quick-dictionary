<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="Look up English words, hear pronunciation, and see noun images." />
  <title>Quick Dictionary — Speak & See</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Quick Dictionary</h1>
    <div class="search-row">
      <input id="wordInput" placeholder="Type a word and press Enter" autofocus />
      <button id="searchBtn">Lookup</button>
      <button id="speakBtn" title="Pronounce">🔊</button>
      <button id="refreshBtn" title="Refresh app">⟳</button>
    </div>
    <section id="result">
      <div id="phonetic" class="phonetic"></div>
      <div id="meanings"></div>
      <div id="images" class="images"></div>
    </section>
    <footer>
      <small>Uses dictionaryapi.dev and Wikimedia Commons; pronunciation uses your browser's SpeechSynthesis.</small>
    </footer>
  </main>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('./service-worker.js');
          if (reg.update) reg.update();
        } catch (err) {
          // ignore registration failures
        }
      });
    }
  </script>
</body>
</html>
